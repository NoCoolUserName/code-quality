name: Shared code quality

on:
  workflow_call:
    inputs:
      checkout-paths:
        description: Optional sparse checkout paths for repositories containing large archival data.
        type: string
        default: ''
      use-secret-config:
        description: Use audited .github/gitleaks.toml exceptions for exact known public or synthetic values.
        type: boolean
        default: false
      python-version:
        type: string
        default: '3.12'
      python-lint:
        type: boolean
        default: true
      use-python-lint-config:
        description: Use an established repository Ruff configuration instead of the shared correctness rules.
        type: boolean
        default: false
      typecheck-command:
        description: Explicit incremental mypy check; blank when absent or already covered.
        type: string
        default: ''
      typecheck-packages:
        description: Optional pinned type stubs needed by the configured mypy check.
        type: string
        default: ''
      install-command:
        description: Explicit dependency installation for repositories without existing CI.
        type: string
        default: ''
      test-command:
        description: Explicit offline tests; blank when absent or already covered.
        type: string
        default: ''
      node-directory:
        description: Directory with package.json; blank disables Node checks.
        type: string
        default: ''
      node-scripts:
        description: Space-separated noninteractive package scripts to run if defined.
        type: string
        default: 'lint typecheck test'
      node-required-scripts:
        description: Scripts that must exist and run; missing scripts fail validation.
        type: string
        default: ''
      node-lockfile-required:
        description: Require a committed lockfile; false resolves a temporary lock before npm ci.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          sparse-checkout: ${{ inputs.checkout-paths }}

      - name: Install verified secret scanner
        env:
          USE_SECRET_CONFIG: ${{ inputs.use-secret-config }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/quality-tools"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$dir/gitleaks.tar.gz"
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  '"$dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$dir/gitleaks.toml"
          if [ "$USE_SECRET_CONFIG" = true ]; then
            test -f .github/gitleaks.toml
            test ! -L .github/gitleaks.toml
            cp .github/gitleaks.toml "$dir/gitleaks.toml"
          fi
          : > "$dir/empty-ignore"
          # Prove detection works before trusting a clean result. This is a fake key.
          mkdir -p "$dir/self-test"
          python3 - "$dir/self-test/key.txt" <<'PY'
          import pathlib, sys
          pathlib.Path(sys.argv[1]).write_text('token = "' + 'gh' + 'p_' + 'aB3dE5fG7hJ9kL1mN3pQ5rS7tU9vW1xY3zA5' + '"\n')
          PY
          set +e
          "$dir/gitleaks" dir "$dir/self-test" --config "$dir/gitleaks.toml" \
            --gitleaks-ignore-path "$dir/empty-ignore" --redact=100 --no-banner >/dev/null 2>&1
          status=$?
          set -e
          rm -rf "$dir/self-test"
          if [ "$status" -ne 1 ]; then
            echo '::error::Secret scanner self-test failed.'
            exit 1
          fi

      - name: Scan tracked snapshot for secrets
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/quality-tools"
          # Scan tracked regular files only: never Git credentials, ignored files or dependencies.
          snapshot="$RUNNER_TEMP/quality-snapshot"
          mkdir -p "$snapshot"
          python3 - "$snapshot" <<'PY'
          import pathlib, shutil, subprocess, sys
          root = pathlib.Path.cwd()
          destination = pathlib.Path(sys.argv[1])
          count = 0
          skipped = 0
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              relative = pathlib.Path(raw.decode('utf-8', 'surrogateescape'))
              source = root / relative
              if source.is_symlink() or not source.is_file():
                  skipped += 1
                  continue
              target = destination / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              count += 1
          print(f'Scanning {count} tracked files at the checked-out commit.')
          if skipped:
              print(f'{skipped} unavailable or symlink files skipped (including files outside configured sparse paths).')
          PY
          set +e
          "$dir/gitleaks" dir "$snapshot" --config "$dir/gitleaks.toml" \
            --gitleaks-ignore-path "$dir/empty-ignore" --redact=100 --no-banner --exit-code 1 \
            --report-format json --report-path "$dir/findings.json"
          scan_status=$?
          set -e
          python3 - "$dir/findings.json" "$snapshot" <<'PY'
          import json, pathlib, sys
          report = pathlib.Path(sys.argv[1])
          root = pathlib.Path(sys.argv[2])
          for finding in json.loads(report.read_text()) if report.exists() else []:
              file = pathlib.Path(finding['File'])
              try:
                  file = file.relative_to(root)
              except ValueError:
                  pass
              # Print locations only, never matching lines or credential values.
              print('Secret finding: ' + json.dumps({
                  'file': str(file), 'line': finding['StartLine'],
                  'rule': finding['RuleID'],
              }))
          PY
          rm -f "$dir/findings.json"
          if [ "$scan_status" -ne 0 ]; then
            rm -rf "$snapshot"
            exit "$scan_status"
          fi
          echo '### Secrets: passed (tracked snapshot; no historical scan)' >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$snapshot"

      - name: Set up Python
        if: inputs.python-lint || inputs.install-command != '' || inputs.test-command != '' || inputs.typecheck-command != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Python correctness lint
        if: inputs.python-lint
        env:
          USE_PYTHON_LINT_CONFIG: ${{ inputs.use-python-lint-config }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git ls-files '*.py')" ]; then
            echo '### Python lint: skipped (no tracked Python files)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m pip install --only-binary=:all: --no-deps ruff==0.17.0
          if [ "$USE_PYTHON_LINT_CONFIG" = true ]; then
            python -m ruff check .
          else
            # Correctness checks avoid requiring unrelated formatting or application changes.
            python -m ruff check --isolated --select E9,F63,F7,F82,B002,B006,B012,B014,B016,B018,B019,B024,B025,B026,B029,B030,B034,SIM101,SIM201,SIM202,SIM208,SIM211 .
          fi
          echo '### Python correctness lint: passed' >> "$GITHUB_STEP_SUMMARY"

      - name: Install configured Python dependencies
        if: inputs.install-command != ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        shell: bash
        run: bash --noprofile --norc -e -o pipefail -c "$INSTALL_COMMAND"

      - name: Run configured Python type checks
        if: inputs.typecheck-command != ''
        env:
          TYPECHECK_COMMAND: ${{ inputs.typecheck-command }}
          TYPECHECK_PACKAGES: ${{ inputs.typecheck-packages }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: mypy==2.4.0
          if [ -n "$TYPECHECK_PACKAGES" ]; then
            python -m pip install --only-binary=:all: $TYPECHECK_PACKAGES
          fi
          bash --noprofile --norc -e -o pipefail -c "$TYPECHECK_COMMAND"
          echo '### Configured Python type checks: passed' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain Python type coverage
        if: inputs.typecheck-command == ''
        shell: bash
        run: |
          echo '### Shared Python types: skipped (no selected target or covered by existing repository CI)' >> "$GITHUB_STEP_SUMMARY"

      - name: Run configured offline Python tests
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        shell: bash
        run: |
          bash --noprofile --norc -e -o pipefail -c "$TEST_COMMAND"
          echo '### Configured Python tests: passed' >> "$GITHUB_STEP_SUMMARY"

      - name: Explain Python test coverage
        if: inputs.test-command == ''
        shell: bash
        run: |
          echo '### Shared Python tests: skipped (absent or covered by existing repository CI)' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: inputs.node-directory != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run available Node checks
        if: inputs.node-directory != ''
        env:
          NODE_DIRECTORY: ${{ inputs.node-directory }}
          NODE_SCRIPTS: ${{ inputs.node-scripts }}
          NODE_REQUIRED_SCRIPTS: ${{ inputs.node-required-scripts }}
          NODE_LOCKFILE_REQUIRED: ${{ inputs.node-lockfile-required }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$NODE_DIRECTORY"
          if [ ! -f package.json ]; then
            echo '::error::Configured Node directory has no package.json.'
            exit 1
          fi
          # Required checks cannot silently disappear from package.json.
          for script in $NODE_REQUIRED_SCRIPTS; do
            if [[ ! "$script" =~ ^[A-Za-z0-9_][A-Za-z0-9:_-]*$ ]]; then
              echo '::error::Invalid required Node script name.'
              exit 1
            fi
            if ! node -e 'const p=require("./package.json"); process.exit(p.scripts?.[process.argv[1]] ? 0 : 1)' "$script"; then
              echo "::error::Required Node script is missing: $script"
              exit 1
            fi
          done
          if [ ! -f package-lock.json ]; then
            if [ "$NODE_LOCKFILE_REQUIRED" != false ]; then
              echo '::error::Configured Node checks require package-lock.json; refusing an unlocked install.'
              exit 1
            fi
            # Explicit opt-in for repositories whose policy excludes committed locks.
            # This locks one run; future runs may resolve different in-range versions.
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo '### Node install: temporary lock resolved (not reproducible across runs)' >> "$GITHUB_STEP_SUMMARY"
          fi
          npm ci --no-audit --no-fund
          npm ls --depth=0
          declare -A completed=()
          for script in $NODE_SCRIPTS $NODE_REQUIRED_SCRIPTS; do
            if [[ ! "$script" =~ ^[A-Za-z0-9_][A-Za-z0-9:_-]*$ ]]; then
              echo '::error::Invalid Node script name.'
              exit 1
            fi
            if [[ -n "${completed[$script]:-}" ]]; then
              continue
            fi
            completed[$script]=1
            if node -e 'const p=require("./package.json"); process.exit(p.scripts?.[process.argv[1]] ? 0 : 1)' "$script"; then
              npm run "$script"
              echo "### Node $script: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Node $script: skipped (script absent)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Failure guidance
        if: failure()
        shell: bash
        run: |
          echo '### Check failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open the red step above for the cause. Missing dependencies or scanner failures are failures, not clean results. Secret values are redacted; no reports or source files are uploaded.' >> "$GITHUB_STEP_SUMMARY"

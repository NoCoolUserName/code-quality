name: Shared security analysis
on:
  workflow_call:
    inputs:
      framework-ref:
        type: string
        required: true
      checkout-paths:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  semgrep:
    name: Security / Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: target
          sparse-checkout: ${{ inputs.checkout-paths }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NoCoolUserName/code-quality
          ref: ${{ inputs.framework-ref }}
          persist-credentials: false
          path: framework
          sparse-checkout: rules
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned local scanner
        run: 'python -m pip install --only-binary=:all: semgrep==1.180.0'
      - name: Offline security rules, no telemetry or cloud upload
        working-directory: target
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: semgrep scan --config ../framework/rules/security.yml --metrics off --disable-version-check --error --strict --timeout 10 --max-memory 2048 --no-git-ignore --exclude '**/node_modules/**' --exclude '**/.venv/**' --exclude '**/dist/**' .

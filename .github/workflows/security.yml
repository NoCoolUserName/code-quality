name: Shared security analysis
on:
  workflow_call:
    inputs:
      framework-ref:
        type: string
        required: true
      checkout-paths:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  semgrep:
    name: Security / Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: target
          sparse-checkout: ${{ inputs.checkout-paths }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NoCoolUserName/code-quality
          ref: ${{ inputs.framework-ref }}
          persist-credentials: false
          path: framework
          sparse-checkout: rules
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned local scanner
        run: 'python -m pip install --only-binary=:all: semgrep==1.180.0'
      - name: Offline security rules, no telemetry or cloud upload
        working-directory: target
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: semgrep scan --config ../framework/rules/security.yml --metrics off --disable-version-check --error --strict --timeout 10 --max-memory 2048 --no-git-ignore --exclude '**/node_modules/**' --exclude '**/.venv/**' --exclude '**/dist/**' .

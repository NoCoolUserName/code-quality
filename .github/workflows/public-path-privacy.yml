name: Public path privacy
on:
  push:
    branches: [main]
  pull_request_target:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full SHA immediately before the commits to inspect
        required: true
        type: string
permissions:
  contents: read
jobs:
  tracked-files:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked content and new commit metadata
        env:
          BASE_SHA: ${{ github.event.before || inputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          python3 scripts/check_public_privacy.py \
            --owner "$REPO_OWNER" --owner-id "$REPO_OWNER_ID" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --base-mode direct
  proposed-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      # This checkout and the executed scanner come from the trusted base branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
      # Proposed code is read as data. Never execute a file from this checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: proposed
          persist-credentials: false
      - name: Check proposed tracked content and commit metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          git -C proposed fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$BASE_SHA"
          cd proposed
          python3 ../trusted/scripts/check_public_privacy.py \
            --owner "$REPO_OWNER" --owner-id "$REPO_OWNER_ID" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --base-mode merge-base

name: Framework security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    permissions:
      contents: read
      security-events: write
      actions: read
    # Local calls resolve to this run's exact commit, so PRs test their own workflow.
    uses: ./.github/workflows/codeql.yml
    with:
      framework-ref: ${{ github.sha }}
      languages: python
